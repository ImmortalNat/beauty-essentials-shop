<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Beauty Essentials</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .momo-box{background:#fffcf0;border:1.5px solid #f59e0b;padding:1.2rem;border-radius:10px;margin:1rem 0}
    .momo-num{background:#1a1a2e;color:#f59e0b;font-family:monospace;font-size:1.2rem;font-weight:800;padding:.7rem;border-radius:8px;text-align:center;margin:.5rem 0}
  </style>
</head>
<body>
  <nav class="navbar"><a href="/" class="navbar-brand">👑 Beauty <span>Essentials</span></a><ul class="navbar-links"><li><a href="/cart">← Cart</a></li></ul></nav>
  <div class="page-container">
    <h2 style="color:#d62865;margin-bottom:1rem">Checkout (Direct MoMo Only)</h2>
    <div class="checkout-layout">
      <form class="checkout-form" id="checkoutForm">
        <div class="form-group"><label>Full Name *</label><input id="name" required placeholder="Abena Mensah"></div>
        <div class="form-group"><label>Email</label><input id="email" type="email" placeholder="abena@example.com"></div>
        <div class="form-group"><label>Phone / MoMo Number *</label><input id="phone" required placeholder="0548950991"></div>
        <div class="form-group"><label>Delivery Address *</label><input id="address" required placeholder="East Legon, Accra"></div>

        <div class="momo-box">
          <h4 style="color:#b7791f;margin-bottom:.4rem">💳 Pay by Direct MoMo</h4>
          <ol style="margin-left:1.1rem;font-size:.9rem;line-height:1.55;color:#4a5568">
            <li>Send the exact total to either number:</li>
          </ol>
          <div class="momo-num">0548950991</div>
          <div class="momo-num">0249356589</div>
          <p style="font-size:.88rem;color:#4a5568"><b>Account Name:</b> Beauty Essentials / Business Owner</p>
          <p style="font-size:.88rem;color:#4a5568">After sending, copy Transaction ID from MoMo SMS and paste below.</p>
          <div class="form-group" style="margin-top:.8rem">
            <label style="color:#b7791f">MoMo Transaction ID *</label>
            <input id="momoTxId" required placeholder="e.g. 2481029481">
          </div>
        </div>

        <button class="btn" id="payBtn" type="submit" style="font-size:1.05rem;padding:1rem">Submit MoMo Order ✓</button>
      </form>
      <div class="cart-summary" id="orderSummary"></div>
    </div>
  </div>
  <script src="/js/checkout.js"></script>
</body>
</html>
