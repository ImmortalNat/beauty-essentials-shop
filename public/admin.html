<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Beauty Essentials</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .tab-bar{display:flex;gap:.5rem;border-bottom:2px solid #fce7f0;margin-bottom:1.5rem;flex-wrap:wrap}
    .tab-btn{padding:.8rem 1.1rem;background:none;border:none;font-weight:700;color:#6c757d;cursor:pointer;border-bottom:3px solid transparent}
    .tab-btn.active{color:#d62865;border-color:#ff4d8d}
    .admin-card{background:#fff;padding:1.2rem;border-radius:12px;box-shadow:0 4px 20px rgba(255,77,141,.12);margin-bottom:1rem}
    .order-card{background:#fff;border-radius:12px;padding:1.2rem;margin-bottom:1rem;border-left:6px solid #ff4d8d;box-shadow:0 4px 20px rgba(255,77,141,.1)}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
    .modal-content{background:#fff;padding:1.5rem;border-radius:12px;width:92%;max-width:480px;max-height:90vh;overflow:auto}
    .cat-pill { display:inline-flex; align-items:center; gap:0.5rem; background:#fff0f5; border:1px solid #fce7f0; padding:0.5rem 1rem; border-radius:20px; font-weight:bold; font-size:0.9rem; margin:0.3rem; }
  </style>
</head>
<body>
  <nav class="navbar"><a href="/" class="navbar-brand">🛡️ Admin <span>Beauty Essentials</span></a><ul class="navbar-links"><li><a href="/" target="_blank">View Store</a></li></ul></nav>

  <div class="page-container">
    <div id="loginBox" style="max-width:380px;margin:3rem auto;background:#fff;padding:2rem;border-radius:14px;text-align:center;box-shadow:0 4px 20px rgba(255,77,141,.12)">
      <h3>🔐 Admin Login</h3>
      <input type="password" id="pass" placeholder="Password (admin123)" style="width:100%;padding:.8rem;margin:1rem 0;border:1.5px solid #f472b6;border-radius:8px">
      <button class="btn" onclick="init()">Unlock Dashboard</button>
    </div>

    <div id="dash" style="display:none">
      <div class="tab-bar">
        <button class="tab-btn active" onclick="tab('orders',this)">📦 Orders & Progress</button>
        <button class="tab-btn" onclick="tab('products',this)">🛍️ Products</button>
        <button class="tab-btn" onclick="tab('categories',this)">🏷️ Categories</button>
        <button class="tab-btn" onclick="tab('delivery',this)">🚚 Delivery Fees</button>
        <button class="tab-btn" onclick="tab('brand',this)">🎨 Storefront</button>
      </div>

      <!-- ORDERS -->
      <div id="ordersTab">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:.5rem;flex-wrap:wrap">
          <h3>Customer Orders</h3>
          <button class="btn" style="width:auto;padding:.5rem 1rem;background:#6c757d" onclick="loadOrders()">🔄 Refresh</button>
        </div>
        <div id="ordersList">Loading...</div>
      </div>

      <!-- PRODUCTS -->
      <div id="productsTab" style="display:none">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:.5rem;flex-wrap:wrap">
          <h3>Products Catalog</h3>
          <button class="btn" style="width:auto;background:#10b981;padding:.6rem 1rem" onclick="openModal()">➕ Add Product</button>
        </div>
        <div class="products-grid" id="pList" style="padding:0"></div>
      </div>

      <!-- CATEGORIES -->
      <div id="categoriesTab" style="display:none;">
        <div class="admin-card">
          <h3>➕ Add New Store Category</h3>
          <form onsubmit="saveCategory(event)" style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:1rem;">
            <div class="form-group"><label>Category Name *</label><input type="text" id="catName" required placeholder="e.g. Wigs, Skincare"></div>
            <div class="form-group"><label>Icon Emoji</label><input type="text" id="catIcon" value="💄"></div>
            <button type="submit" class="btn" style="grid-column:1/-1;">💾 Create Category</button>
          </form>
        </div>
        <div class="admin-card">
          <h3>Active Categories</h3>
          <div id="categoriesList" style="margin-top:0.8rem;">Loading...</div>
        </div>
      </div>

      <!-- DELIVERY FEES -->
      <div id="deliveryTab" style="display:none;">
        <div class="admin-card">
          <h3>➕ Add Region, Town & Delivery Fee</h3>
          <form onsubmit="saveDelivery(event)" style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label>1. Region *</label>
              <select id="delRegion" required style="width:100%; padding:0.7rem; border-radius:6px; border:1px solid #ddd; font-weight:bold;">
                <option value="Greater Accra">Greater Accra Region</option>
                <option value="Ashanti">Ashanti Region</option>
                <option value="Western">Western Region</option>
                <option value="Central">Central Region</option>
                <option value="Eastern">Eastern Region</option>
                <option value="Northern">Northern Region</option>
                <option value="Volta">Volta Region</option>
              </select>
            </div>
            <div class="form-group"><label>2. Town / City / Area *</label><input type="text" id="delTown" required placeholder="e.g. East Legon"></div>
            <div class="form-group" style="grid-column: 1/-1;"><label>3. Delivery Fee (GH₵) *</label><input type="number" step="1" id="delFee" required placeholder="e.g. 30"></div>
            <button type="submit" class="btn" style="grid-column:1/-1;">💾 Save Delivery Zone</button>
          </form>
        </div>
        <div class="admin-card">
          <h3>Active Delivery Zones & Fees</h3>
          <div id="deliveryList" style="margin-top:0.8rem;">Loading...</div>
        </div>
      </div>

      <!-- STOREFRONT -->
      <div id="brandTab" style="display:none">
        <form class="admin-card" onsubmit="saveBrand(event)">
          <h3>🎨 Edit Storefront</h3>
          <div class="form-group"><label>Store Name</label><input id="sName" required></div>
          <div class="form-group"><label>Tagline</label><input id="sTagline"></div>
          <div class="form-group"><label>Top Announcement</label><input id="sAnnounce"></div>
          <div class="form-group"><label>Hero Title</label><input id="sHero" required></div>
          <div class="form-group"><label>Hero Subtitle</label><input id="sSub" required></div>
          <div class="form-group"><label>WhatsApp Number (233...)</label><input id="sWa" required></div>
          <div class="form-group"><label>MoMo Number 1</label><input id="sPhone1" required></div>
          <div class="form-group"><label>MoMo Number 2</label><input id="sPhone2"></div>
          <div class="form-group"><label>MoMo Account Name</label><input id="sMomoName" required></div>
          <div class="form-group"><label>Shop Address</label><input id="sAddress"></div>
          <button class="btn" type="submit">💾 Save Storefront</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Product Modal -->
  <div class="modal" id="m">
    <div class="modal-content">
      <h3 id="mTitle">Add Product</h3>
      <form onsubmit="saveProduct(event)">
        <input type="hidden" id="pid"><input type="hidden" id="pimgb64">
        <div class="form-group"><label>Name *</label><input id="pname" required></div>
        <div class="form-group"><label>Price GH₵ *</label><input type="number" step="0.01" id="pprice" required></div>
        <div class="form-group"><label>Category *</label><select id="pcat" required style="width:100%;padding:.7rem;border:1.5px solid #f472b6;border-radius:8px"></select></div>
        <div class="form-group"><label>Photo * (Camera/Gallery)</label><input type="file" accept="image/*" onchange="handleImg(event)" style="width:100%;padding:.6rem;border:1.5px dashed #ff4d8d;border-radius:8px;background:#fff0f5;"></div>
        <img id="prev" style="display:none;width:100px;height:100px;object-fit:cover;border-radius:8px;margin-bottom:.8rem">
        <div class="form-group"><label>Description</label><textarea id="pdesc" rows="3" style="width:100%;padding:.7rem;border:1.5px solid #f472b6;border-radius:8px"></textarea></div>
        <div style="display:flex;gap:.5rem">
          <button class="btn" type="submit" style="background:#10b981">Save</button>
          <button class="btn" type="button" style="background:#6c757d" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let P = '';
    let storeCategories = [];

    function tab(id, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ['orders','products','brand','categories','delivery'].forEach(t => document.getElementById(t+'Tab').style.display = t === id ? 'block' : 'none');
      if (id === 'orders') loadOrders();
      if (id === 'products') loadProducts();
      if (id === 'brand') loadBrand();
      if (id === 'categories') loadCategories();
      if (id === 'delivery') loadDelivery();
    }

    async function init() {
      P = document.getElementById('pass').value;
      const r = await fetch('/api/admin/orders', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: P }) });
      const d = await r.json();
      if (!d.success) return alert(d.message || 'Wrong password');
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('dash').style.display = 'block';
      await loadCategories();
      loadOrders();
    }

    // ================= CATEGORIES =================
    async function loadCategories() {
      const res = await fetch('/api/categories?t=' + Date.now());
      storeCategories = await res.json();
      const box = document.getElementById('categoriesList');
      box.innerHTML = storeCategories.map(c => `
        <div class="cat-pill"><span>${c.icon} ${c.name}</span>
        <button onclick="deleteCategory(${c.id})" style="background:none; border:none; color:#dc3545; cursor:pointer; font-weight:bold; margin-left:0.4rem;">✕</button></div>
      `).join('');
      document.getElementById('pcat').innerHTML = storeCategories.map(c => `<option value="${c.name}">${c.icon} ${c.name}</option>`).join('');
    }
    async function saveCategory(e) {
      e.preventDefault();
      await fetch('/api/admin/categories/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: P, category: { name: document.getElementById('catName').value, icon: document.getElementById('catIcon').value || '💋' } }) });
      document.getElementById('catName').value = ''; loadCategories();
    }
    async function deleteCategory(id) {
      if (!confirm('Delete?')) return;
      await fetch('/api/admin/categories/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: P, categoryId: id }) });
      loadCategories();
    }

    // ================= DELIVERY =================
    async function loadDelivery() {
      const res = await fetch('/api/delivery?t=' + Date.now());
      const locations = await res.json();
      const box = document.getElementById('deliveryList');
      if (!locations.length) { box.innerHTML = '<p>No delivery zones set. Delivery is free.</p>'; return; }
      box.innerHTML = locations.map(l => `
        <div style="display:flex; justify-content:space-between; padding:0.8rem; background:#fff5f8; border:1px solid #fce7f0; border-radius:6px; margin-bottom:0.5rem; align-items:center;">
          <div><span style="background:#ff4d8d; color:#fff; font-size:0.75rem; padding:2px 6px; border-radius:4px;">${l.region}</span><strong style="margin-left:0.5rem;">${l.town}</strong></div>
          <div><span style="color:#d62865; font-weight:bold; margin-right:1rem;">GH₵${Number(l.fee).toFixed(2)}</span><button onclick="deleteDelivery(${l.id})" style="background:#dc3545; border:none; color:#fff; padding:4px 8px; border-radius:4px; cursor:pointer;">Delete</button></div>
        </div>
      `).join('');
    }
    async function saveDelivery(e) {
      e.preventDefault();
      await fetch('/api/admin/delivery/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: P, loc: { region: document.getElementById('delRegion').value, town: document.getElementById('delTown').value, fee: document.getElementById('delFee').value } }) });
      document.getElementById('delTown').value = ''; document.getElementById('delFee').value = ''; loadDelivery();
    }
    async function deleteDelivery(id) {
      if (!confirm('Delete?')) return;
      await fetch('/api/admin/delivery/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: P, id }) });
      loadDelivery();
    }

    // ================= ORDERS =================
    async function loadOrders() {
      const r = await fetch('/api/admin/orders', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: P }) });
      const d = await r.json();
      const box = document.getElementById('ordersList');
      if (!d.orders.length) return box.innerHTML = '<p>No orders yet.</p>';
      box.innerHTML = d.orders.map(o => `
        <div class="order-card">
          <div style="display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap">
            <strong>Ref: ${o.reference}</strong>
            <strong style="color:#d62865">GH₵${Number(o.amount).toFixed(2)}</strong>
          </div>
          <div style="background:#fff0f5;padding:.8rem;border-radius:8px;margin:.8rem 0;font-size:.9rem;line-height:1.6">
            👤 <b>${o.customerName}</b> (${o.customerEmail || 'N/A'})<br>
            📞 <a href="https://wa.me/233${String(o.phone||'').replace(/^0/,'')}" target="_blank" style="color:#25D366;font-weight:700">💬 ${o.phone}</a><br>
            📍 ${o.address || 'N/A'}<br>
            🛍️ ${o.items}
          </div>
          <label><b>Update Progress</b></label>
          <select style="width:100%;padding:.55rem;margin:.35rem 0 .6rem;border:1.5px solid #f472b6;border-radius:8px;font-weight:700" onchange="updateProgress('${o.reference}', this.value)">
            <option value="Awaiting MoMo Verification" ${o.status==='Awaiting MoMo Verification'?'selected':''}>🟡 Awaiting MoMo Verification</option>
            <option value="Packaging" ${o.status==='Packaging'?'selected':''}>📦 Packaging</option>
            <option value="Out for Delivery" ${o.status==='Out for Delivery'?'selected':''}>🚚 Out for Delivery</option>
            <option value="Delivered" ${o.status==='Delivered'?'selected':''}>🟢 Delivered</option>
          </select>
          <input id="note_${o.reference}" value="${(o.deliveryNote||'').replace(/"/g,'&quot;')}" placeholder="Delivery note for customer..." style="width:100%;padding:.55rem;border:1.5px solid #f472b6;border-radius:8px;margin-bottom:.5rem">
          <button class="btn" style="background:#ff4d8d" onclick="saveNote('${o.reference}')">💾 Save Note & Status</button>
          <div style="margin-top:.5rem;font-size:.85rem;color:#6c757d">Current: <b>${o.status}</b></div>
        </div>
      `).join('');
    }
    async function updateProgress(ref, status) {
      const noteEl = document.getElementById('note_' + ref);
      await fetch('/api/admin/update-progress', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: P, reference: ref, status, deliveryNote: noteEl ? noteEl.value : '' }) });
      loadOrders();
    }
    async function saveNote(ref) { const sel = document.querySelector(`select[onchange*="${ref}"]`); await updateProgress(ref, sel ? sel.value : 'Packaging'); alert('Updated!'); }

    // ================= PRODUCTS =================
    async function loadProducts() {
      const ps = await (await fetch('/api/products?t='+Date.now())).json();
      document.getElementById('pList').innerHTML = ps.map(p => `
        <div class="admin-card">
          <img src="${p.image}" style="width:100%;height:150px;object-fit:cover;border-radius:8px">
          <h4 style="margin:.5rem 0 .2rem">${p.name}</h4>
          <span style="color:#6c757d; font-size:0.85rem; display:block;">Category: ${p.category}</span>
          <div style="color:#d62865;font-weight:800">GH₵${Number(p.price).toFixed(2)}</div>
          <div style="display:flex;gap:.4rem;margin-top:.6rem">
            <button class="btn" style="padding:.4rem;background:#ff4d8d" onclick='editP(${JSON.stringify(p)})'>Edit</button>
            <button class="btn" style="padding:.4rem;background:#ef4444" onclick="delP(${p.id})">Delete</button>
          </div>
        </div>
      `).join('');
    }
    function openModal() { document.getElementById('mTitle').textContent = 'Add Product'; ['pid','pname','pprice','pdesc','pimgb64'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; }); document.getElementById('prev').style.display = 'none'; document.getElementById('m').style.display = 'flex'; }
    function closeModal(){ document.getElementById('m').style.display='none'; }
    function editP(p){ document.getElementById('mTitle').textContent='Edit Product'; document.getElementById('pid').value=p.id; document.getElementById('pname').value=p.name; document.getElementById('pprice').value=p.price; document.getElementById('pcat').value=p.category; document.getElementById('pimgb64').value=p.image||''; document.getElementById('pdesc').value=p.description||''; const prev=document.getElementById('prev'); prev.src=p.image; prev.style.display='block'; document.getElementById('m').style.display='flex'; }
    function compressImg(file, cb) { const r = new FileReader(); r.onload = e => { const i = new Image(); i.onload = () => { const c = document.createElement('canvas'); let w=i.width, h=i.height, m=600; if(w>h){if(w>m){h*=m/w;w=m;}} else {if(h>m){w*=m/h;h=m;}} c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h); cb(c.toDataURL('image/jpeg',.85)); }; i.src=e.target.result; }; r.readAsDataURL(file); }
    function handleImg(e){ const f=e.target.files[0]; if(!f) return; compressImg(f, b64 => { document.getElementById('pimgb64').value=b64; const p=document.getElementById('prev'); p.src=b64; p.style.display='block'; }); }
    async function saveProduct(e){ e.preventDefault(); const image = document.getElementById('pimgb64').value; if(!image) return alert('Add photo'); const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='Saving...'; await fetch('/api/admin/products/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password:P, product:{ id: document.getElementById('pid').value, name: document.getElementById('pname').value, price: document.getElementById('pprice').value, category: document.getElementById('pcat').value, image, description: document.getElementById('pdesc').value }}) }); btn.disabled=false; btn.textContent='Save'; closeModal(); loadProducts(); }
    async function delP(id){ if(!confirm('Delete product?')) return; await fetch('/api/admin/products/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password:P, productId:id }) }); loadProducts(); }

    // ================= STOREFRONT =================
    async function loadBrand(){
      const s = await (await fetch('/api/settings?t='+Date.now())).json();
      document.getElementById('sName').value = s.storeName||''; document.getElementById('sTagline').value = s.tagline||''; document.getElementById('sAnnounce').value = s.announcement||''; document.getElementById('sHero').value = s.heroTitle||''; document.getElementById('sSub').value = s.heroSubtitle||''; document.getElementById('sWa').value = s.whatsappNumber||''; document.getElementById('sPhone1').value = s.supportPhone1||''; document.getElementById('sPhone2').value = s.supportPhone2||''; document.getElementById('sMomoName').value = s.momoName||''; document.getElementById('sAddress').value = s.shopAddress||'';
    }
    async function saveBrand(e){
      e.preventDefault(); await fetch('/api/admin/settings/save', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password:P, settings:{ storeName: document.getElementById('sName').value, tagline: document.getElementById('sTagline').value, announcement: document.getElementById('sAnnounce').value, heroTitle: document.getElementById('sHero').value, heroSubtitle: document.getElementById('sSub').value, whatsappNumber: document.getElementById('sWa').value, supportPhone1: document.getElementById('sPhone1').value, supportPhone2: document.getElementById('sPhone2').value, momoName: document.getElementById('sMomoName').value, shopAddress: document.getElementById('sAddress').value }}) }); alert('Storefront saved!');
    }
  </script>
</body>
</html>
