<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Submitted - Beauty Essentials</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar"><a href="/" class="navbar-brand">👑 Beauty <span>Essentials</span></a></nav>
  <div class="page-container" style="max-width:600px;text-align:center;margin-top:3rem">
    <div style="background:#fff;padding:2rem;border-radius:14px;box-shadow:0 4px 20px rgba(255,77,141,.12)">
      <h1 style="font-size:3rem;margin:0">🎉</h1>
      <h2 style="color:#d62865">Order Submitted!</h2>
      <p id="statusMsg">Loading order details...</p>
      <div id="txInfo" style="display:none;text-align:left;background:#fff0f5;padding:1rem;border-radius:8px;margin:1rem 0;font-size:.92rem;line-height:1.6"></div>
      <a id="wa" target="_blank" class="btn" style="display:block;background:#25D366;text-decoration:none;margin-top:1rem">💬 WhatsApp us your MoMo screenshot</a>
      <a href="/track" class="btn" style="display:block;margin-top:.7rem;background:#ff4d8d;text-decoration:none">📦 Track Order Progress</a>
      <a href="/" class="btn" style="display:block;margin-top:.7rem;background:#6c757d;text-decoration:none">Back to Shop</a>
    </div>
  </div>
  <script>
    const ref = new URLSearchParams(location.search).get('reference');
    if (ref) {
      fetch('/api/orders/' + encodeURIComponent(ref)).then(r => r.json()).then(d => {
        if (d.success) {
          const o = d.order;
          document.getElementById('statusMsg').textContent = 'We received your order. Status: ' + o.status;
          document.getElementById('txInfo').style.display = 'block';
          document.getElementById('txInfo').innerHTML =
            '<strong>Reference:</strong> ' + o.reference +
            '<br><strong>Amount:</strong> GH₵' + Number(o.amount).toFixed(2) +
            '<br><strong>Name:</strong> ' + o.customerName +
            '<br><strong>Items:</strong> ' + o.items;
          document.getElementById('wa').href = 'https://wa.me/233548950991?text=' + encodeURIComponent('Hi, I just ordered. MoMo Tx ID: ' + o.reference + '. Amount: GH₵' + Number(o.amount).toFixed(2));
        } else {
          document.getElementById('statusMsg').textContent = 'Order submitted. Use your MoMo Tx ID on Track Order page.';
          document.getElementById('wa').href = 'https://wa.me/233548950991?text=' + encodeURIComponent('Hi, I paid for an order. Tx ID: ' + ref);
        }
      });
    }
  </script>
</body>
</html>
